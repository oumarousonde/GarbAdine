<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription DG - GarbAdine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    .gradient-bg { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%); }
    .gradient-primary { background: linear-gradient(135deg, #D97706 0%, #B45309 100%); }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .type-card.selected { border-color: #D97706; background: #FEF3C7; transform: scale(1.02); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.15); }
    /* Animation de chargement */
    .loading { pointer-events: none; opacity: 0.7; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle;}
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-6 fade-in">
      <a href="/" class="inline-flex items-center gap-2 mb-4">
        <div class="w-12 h-12 rounded-xl gradient-primary flex items-center justify-center shadow-lg">
          <span class="text-white font-extrabold text-xl">G</span>
        </div>
        <span class="text-3xl font-extrabold text-amber-900">Garb<span class="text-amber-700">Adine</span></span>
      </a>
      <h1 class="text-2xl font-bold text-gray-800">Créer un compte DG</h1>
      <p class="text-sm text-gray-600 mt-2">Commencez à gérer votre établissement dès maintenant.</p>
    </div>

    <div class="glass rounded-3xl shadow-2xl p-8 fade-in">
      
      <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-semibold"></div>
      <div id="successMsg" class="hidden mb-4 p-3 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm font-semibold"></div>

      <form id="registerForm" class="space-y-4">
        
        <!-- Informations Personnelles -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Nom complet</label>
          <input type="text" id="regName" placeholder="Ex: Konan Jean" required
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Numéro de téléphone</label>
          <input type="tel" id="regPhone" placeholder="Ex: 07 07 07 07 07" required
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
          <input type="password" id="regPassword" placeholder="••••••••" required minlength="6"
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <!-- Question Secrète (Récupération) -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Question secrète (pour récupération)</label>
          <select id="regSecretQuestion" required class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition mb-2">
            <option value="">Choisir une question...</option>
            <option value="animal">Quel est le nom de ton premier animal ?</option>
            <option value="ville">Dans quelle ville es-tu né ?</option>
            <option value="plat">Quel est ton plat préféré ?</option>
          </select>
          <input type="text" id="regSecretAnswer" placeholder="Ta réponse..." required
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <!-- Informations Établissement -->
        <div class="pt-4 border-t border-amber-100">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Nom de l'établissement</label>
          <input type="text" id="regShopName" placeholder="Ex: Maquis Chez Tantie" required
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Localisation</label>
          <input type="text" id="regLocation" placeholder="Ex: Abidjan, Cocody" required
            class="w-full px-4 py-3 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:outline-none bg-white/80 transition"/>
        </div>

        <!-- Choix du type (Seulement 2 options) -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-3">Type d'établissement</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" data-type="garbadrome" class="type-card p-4 rounded-xl border-2 border-amber-100 hover:border-amber-400 transition text-center bg-white">
              <div class="text-3xl mb-2">🍲</div>
              <div class="text-sm font-bold text-gray-800">Garbadrome</div>
              <div class="text-xs text-gray-500 mt-1">Attiéké, Poisson...</div>
            </button>
            <button type="button" data-type="restaurant" class="type-card p-4 rounded-xl border-2 border-amber-100 hover:border-amber-400 transition text-center bg-white">
              <div class="text-3xl mb-2">🍽️</div>
              <div class="text-sm font-bold text-gray-800">Restaurant</div>
              <div class="text-xs text-gray-500 mt-1">Riz, Placali...</div>
            </button>
          </div>
          <input type="hidden" id="regShopType" required>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-4 rounded-xl gradient-primary text-white font-bold shadow-lg hover:shadow-xl hover:scale-[1.02] transition transform mt-6 flex items-center justify-center">
          ✨ Créer mon compte
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">Déjà un compte ?</p>
        <a href="/login.html" class="text-amber-600 font-bold hover:underline">Se connecter →</a>
      </div>
    </div>

    <p class="text-center text-sm text-amber-700 mt-6">© 2026 GarbAdine • Tous droits réservés</p>
  </div>

  <script>
    // Sélection du type d'établissement
    document.querySelectorAll('.type-card').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-card').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('regShopType').value = btn.dataset.type;
      });
    });

    // Gestion des messages
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
    }

    // Inscription vers API Neon
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;
      
      // Récupération des valeurs
      const formData = {
        name: document.getElementById('regName').value.trim(),
        phone: document.getElementById('regPhone').value.trim(),
        password: document.getElementById('regPassword').value,
        secretQuestion: document.getElementById('regSecretQuestion').value,
        secretAnswer: document.getElementById('regSecretAnswer').value,
        shopName: document.getElementById('regShopName').value.trim(),
        location: document.getElementById('regLocation').value.trim(),
        shopType: document.getElementById('regShopType').value,
        role: 'dg' // Toujours DG sur cette page
      };

      // Validation basique
      if (!formData.name || !formData.phone || !formData.password || 
          !formData.secretQuestion || !formData.secretAnswer || 
          !formData.shopName || !formData.location || !formData.shopType) {
        showError("Veuillez remplir tous les champs.");
        return;
      }

      // État de chargement
      submitBtn.innerHTML = '<span class="spinner"></span> Création en cours...';
      submitBtn.classList.add('loading');

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showSuccess(data.message);
          
          // Sauvegarde locale temporaire pour la session courante
          localStorage.setItem('user', JSON.stringify(data.user));
          if (data.shopId) {
            localStorage.setItem('shopId', data.shopId);
          }
          
          // Redirection après 1.5 secondes
          setTimeout(() => {
            window.location.href = '/dg.html';
          }, 1500);
          
        } else {
          showError(data.error || "Une erreur est survenue lors de l'inscription.");
          submitBtn.innerHTML = originalText;
          submitBtn.classList.remove('loading');
        }
      } catch (error) {
        console.error('Erreur inscription:', error);
        showError("Erreur de connexion au serveur. Vérifiez votre internet.");
        submitBtn.innerHTML = originalText;
        submitBtn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
