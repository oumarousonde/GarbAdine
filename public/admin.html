<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - GarbAdine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    .gradient-bg { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%); }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 8px;}
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- Header avec Logo -->
    <div class="flex items-center justify-between mb-8 fade-in">
      <a href="/" class="inline-flex items-center gap-2">
        <img src="/assets/logo.png" alt="GarbAdine" class="h-10 w-auto object-contain drop-shadow-md" 
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
        <div style="display:none;" class="w-10 h-10 rounded-xl bg-amber-600 items-center justify-center shadow-md">
          <span class="text-white font-extrabold text-lg">G</span>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-800">Administration GarbAdine 👑</h1>
      </a>
      <button onclick="logout()" class="px-4 py-2 rounded-xl bg-white shadow hover:bg-red-50 text-red-600 font-bold transition">Déconnexion</button>
    </div>

    <!-- Stats Globales -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 fade-in">
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <p class="text-sm text-gray-500">Total Boutiques</p>
        <p class="text-3xl font-extrabold text-gray-800" id="statTotal">--</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-emerald-500">
        <p class="text-sm text-gray-500">Actives</p>
        <p class="text-3xl font-extrabold text-emerald-600" id="statActive">--</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-red-500">
        <p class="text-sm text-gray-500">Expirées</p>
        <p class="text-3xl font-extrabold text-red-600" id="statExpired">--</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-amber-500">
        <p class="text-sm text-gray-500">Revenus Abonnements</p>
        <p class="text-3xl font-extrabold text-amber-600" id="statRevenue">-- F</p>
      </div>
    </div>

    <!-- Liste des Boutiques -->
    <div class="bg-white rounded-2xl shadow-sm p-6 fade-in">
      <h2 class="text-xl font-bold text-gray-800 mb-6">Gestion des Établissements</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">Nom</th>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">Type</th>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">DG</th>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">Fin Abonnement</th>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">Statut</th>
              <th class="p-4 text-xs font-bold text-gray-500 uppercase">Action</th>
            </tr>
          </thead>
          <tbody id="shopTableBody" class="text-sm divide-y">
            <tr><td colspan="6" class="p-8 text-center text-gray-500">Chargement des données...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ===== VÉRIFICATION SESSION ADMIN =====
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!user.id || user.role !== 'admin') {
      window.location.href = '/login.html';
    } else {
      loadAdminData();
    }

    async function loadAdminData() {
      try {
        // TODO: Remplacer par appel API réel quand créé: GET /api/admin/stats
        // Pour l'instant, affichage sécurisé sans crash
        document.getElementById('statTotal').textContent = '0';
        document.getElementById('statActive').textContent = '0';
        document.getElementById('statExpired').textContent = '0';
        document.getElementById('statRevenue').textContent = '0 F';
        
        const tbody = document.getElementById('shopTableBody');
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center">
              <p class="text-gray-500 mb-2">Aucune donnée disponible pour le moment.</p>
              <p class="text-xs text-gray-400">L'API Admin sera connectée prochainement.</p>
            </td>
          </tr>
        `;
        
        /* 
        // CODE FUTUR QUAND API SERA CRÉÉE :
        const res = await fetch('/api/admin/stats');
        const data = await res.json();
        
        document.getElementById('statTotal').textContent = data.totalShops;
        document.getElementById('statActive').textContent = data.activeShops;
        document.getElementById('statExpired').textContent = data.expiredShops;
        document.getElementById('statRevenue').textContent = data.revenue.toLocaleString('fr-FR') + ' F';
        
        tbody.innerHTML = '';
        data.shops.forEach(shop => {
          const isExpired = new Date(shop.subscription_end) < new Date();
          tbody.innerHTML += `

              <td class="p-4 text-gray-600">${shop.dg_name}</td>
              <td class="p-4 text-gray-600">${new Date(shop.subscription_end).toLocaleDateString('fr-FR')}</td>
              <td class="p-4">
                <span class="px-2 py-1 rounded-full text-xs font-bold ${isExpired ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                  ${isExpired ? 'EXPIRÉ' : 'ACTIF'}
                </span>
              </td>
              <td class="p-4">
                <button onclick="renewSub('${shop.id}')" class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded hover:bg-amber-200 font-bold flex items-center gap-1">
                  <span class="spinner hidden" id="spin-${shop.id}"></span>
                  Renouveler (+30j)
                </button>
              </td>
            </tr>
          `;
        });
        */
        
      } catch (error) {
        console.error('Erreur chargement admin:', error);
        document.getElementById('shopTableBody').innerHTML = `
          <tr><td colspan="6" class="p-8 text-center text-red-500">Erreur de chargement. Rafraîchissez la page.</td></tr>
        `;
      }
    }

    async function renewSub(shopId) {
      // TODO: Remplacer par appel API réel: POST /api/admin/renew
      alert("Fonctionnalité de renouvellement bientôt disponible via API.");
      
      /*
      // CODE FUTUR :
      const btn = event.target.closest('button');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      
      try {

        });
        const data = await res.json();
        if (res.ok) {
          alert("Abonnement renouvelé avec succès !");
          loadAdminData();
        } else {
          alert(data.error || "Erreur lors du renouvellement.");
        }
      } catch (e) {
        alert("Erreur de connexion serveur.");
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
      }
      */
    }

    function logout() {
      localStorage.removeItem('user');
      localStorage.removeItem('shopId');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
