<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Déconnexion - GarbAdine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%); }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div class="text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white shadow-lg mb-6">
      <svg class="w-10 h-10 text-amber-600 spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Déconnexion en cours...</h1>
    <p class="text-gray-600">À bientôt sur GarbAdine ! 👋</p>
  </div>

  <script>
    // Nettoyage immédiat
    localStorage.removeItem('user');
    
    // Redirection après 2 secondes
    setTimeout(() => {
      window.location.href = '/';
    }, 2000);
  </script>
</body>
</html>
