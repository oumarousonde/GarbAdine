<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Déconnexion - GarbAdine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%); }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div class="text-center fade-in max-w-md mx-auto">
    <!-- Logo Fallback -->
    <div class="mb-6 flex justify-center">
      <img src="/assets/logo.png" alt="GarbAdine" class="h-16 w-auto object-contain drop-shadow-lg" 
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
      <div style="display:none;" class="w-16 h-16 rounded-2xl bg-amber-600 items-center justify-center shadow-lg">
        <span class="text-white font-extrabold text-3xl">G</span>
      </div>
    </div>

    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white shadow-xl mb-6">
      <svg class="w-10 h-10 text-amber-600 spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </div>
    
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Déconnexion en cours...</h1>
    <p class="text-gray-600 mb-6">Nettoyage de votre session sécurisé.<br>À bientôt sur GarbAdine ! 👋🇧</p>
    
    <div class="w-full bg-gray-200 rounded-full h-1.5 dark:bg-gray-700 overflow-hidden">
      <div id="progressBar" class="bg-amber-600 h-1.5 rounded-full transition-all duration-[2000ms] ease-linear" style="width: 0%"></div>
    </div>
  </div>

  <script>
    // Nettoyage IMMÉDIAT et COMPLET
    localStorage.removeItem('user');
    localStorage.removeItem('shopId');
    localStorage.removeItem('categories');
    sessionStorage.clear();

    // Animation barre de progression + Redirection
    setTimeout(() => {
      document.getElementById('progressBar').style.width = '100%';
    }, 50);

    setTimeout(() => {
      window.location.href = '/';
    }, 2000);
  </script>
</body>
</html>
