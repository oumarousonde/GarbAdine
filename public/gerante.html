<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saisie - GarbAdine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    .gradient-bg { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%); }
    .gradient-primary { background: linear-gradient(135deg, #D97706 0%, #B45309 100%); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(217, 119, 6, 0.15); }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Onglets */
    .tab-btn { transition: all 0.2s; border-bottom: 3px solid transparent; }
    .tab-btn.active-expense { border-bottom-color: #EF4444; color: #991B1B; font-weight: 700; background: rgba(239, 68, 68, 0.05); }
    .tab-btn.active-sale { border-bottom-color: #10B981; color: #065F46; font-weight: 700; background: rgba(16, 185, 129, 0.05); }
    
    .cat-btn.selected { ring: 2px; ring-offset: 2px; transform: scale(1.05); }
    .toast { animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards; }
    @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-100%); } }
  </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">

    <!-- ========== HEADER ========== -->
    <div class="flex items-center justify-between mb-6 fade-in">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-800">Bonjour <span id="geranteName">Gérante</span> 👋</h1>
        <p class="text-gray-600 mt-1">📍 <span id="shopName">Mon établissement</span></p>
      </div>
      <div class="flex items-center gap-3">
        <div class="glass rounded-full px-4 py-2 flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold" id="geranteInitial">G</div>
          <span class="font-semibold text-gray-700 hidden sm:inline" id="geranteNameSmall">Gérante</span>
        </div>
        <button onclick="logout()" class="p-2 rounded-full bg-white hover:bg-red-50 transition" title="Déconnexion">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl bg-emerald-500 text-white font-bold shadow-2xl flex items-center gap-2 toast">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
      <span id="toastMsg">Enregistré !</span>
    </div>

    <!-- ========== STATS DU JOUR ========== -->
    <div class="grid grid-cols-2 gap-3 mb-6 fade-in">
      <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-emerald-500">
        <p class="text-xs text-gray-500 font-semibold">VENTES AUJOURD'HUI</p>
        <p class="text-2xl font-extrabold text-gray-800 mt-1" id="todaySales">0</p>
        <p class="text-xs text-gray-400">FCFA</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-red-500">
        <p class="text-xs text-gray-500 font-semibold">DÉPENSES AUJOURD'HUI</p>
        <p class="text-2xl font-extrabold text-gray-800 mt-1" id="todayExpenses">0</p>
        <p class="text-xs text-gray-400">FCFA</p>
      </div>
    </div>

    <!-- ========== NAVIGATION ONGLETS ========== -->
    <div class="flex gap-2 mb-6 bg-white rounded-2xl p-1 shadow-sm w-fit fade-in">
      <button onclick="switchTab('expense')" id="tab-expense" class="tab-btn active-expense px-6 py-3 rounded-xl text-sm font-bold text-gray-600 hover:text-red-700 flex items-center gap-2">
        🌅 Dépenses (Achats)
      </button>
      <button onclick="switchTab('sale')" id="tab-sale" class="tab-btn px-6 py-3 rounded-xl text-sm font-bold text-gray-600 hover:text-emerald-700 flex items-center gap-2">
        ☀️ Ventes (Recettes)
      </button>
    </div>

    <!-- ========================================== -->
    <!-- FORMULAIRE DE SAISIE                       -->
    <!-- ========================================== -->
    <div class="bg-white rounded-3xl shadow-xl p-5 md:p-6 mb-6 fade-in">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-10 h-10 rounded-xl gradient-primary flex items-center justify-center text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </div>
        <h2 id="formTitle" class="text-xl font-bold text-gray-800">Nouvelle Dépense</h2>
      </div>

      <form id="entryForm" class="space-y-5">
        
        <!-- Catégorie (Auto-complétion) -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">1️⃣ Catégorie</label>
          <input type="text" id="categoryInput" list="categoryList" placeholder="Ex: Attieké, Oignon, Eau..." required
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-amber-500 focus:outline-none text-lg font-bold text-gray-800"
            oninput="saveCategory(this.value)">
          <datalist id="categoryList"></datalist>
          <p class="text-xs text-gray-500 mt-1">Tapez pour chercher ou créer une nouvelle catégorie.</p>
        </div>

        <!-- Description & Date -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">📝 Détails</label>
            <input type="text" id="descInput" placeholder="Ex: 3 sacs, 1 bidon..." required
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">📅 Date</label>
            <input type="date" id="dateInput" required
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-amber-500 focus:outline-none">
          </div>
        </div>

        <!-- Quantité & Prix -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">🔢 Quantité</label>
            <input type="number" id="qtyInput" value="1" min="1" required oninput="calcTotal()"
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-amber-500 focus:outline-none text-center font-bold text-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">💲 Prix Unitaire</label>
            <input type="number" id="priceInput" placeholder="0" min="0" required oninput="calcTotal()"
              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-amber-500 focus:outline-none text-center font-bold text-lg">
            
            <!-- Prix Rapides -->
            <div class="flex gap-2 mt-2 justify-center">
              <button type="button" onclick="setPrice(500)" class="px-2 py-1 rounded bg-gray-100 text-xs font-bold hover:bg-amber-100 transition">500</button>
              <button type="button" onclick="setPrice(1000)" class="px-2 py-1 rounded bg-gray-100 text-xs font-bold hover:bg-amber-100 transition">1k</button>
              <button type="button" onclick="setPrice(2000)" class="px-2 py-1 rounded bg-gray-100 text-xs font-bold hover:bg-amber-100 transition">2k</button>
              <button type="button" onclick="setPrice(5000)" class="px-2 py-1 rounded bg-gray-100 text-xs font-bold hover:bg-amber-100 transition">5k</button>
            </div>
          </div>
        </div>

        <!-- Mode de Paiement (Uniquement pour Ventes) -->
        <div id="paymentSection" class="hidden">
          <label class="block text-sm font-semibold text-gray-700 mb-2">💳 Mode de Paiement</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="payment" value="cash" checked class="peer sr-only">
              <div class="p-3 rounded-xl border-2 border-gray-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 text-center transition">
                <span class="text-xl block mb-1">💵</span>
                <span class="text-sm font-bold text-gray-700">Cash</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="payment" value="om" class="peer sr-only">
              <div class="p-3 rounded-xl border-2 border-gray-200 peer-checked:border-orange-500 peer-checked:bg-orange-50 text-center transition">
                <span class="text-xl block mb-1">📱</span>
                <span class="text-sm font-bold text-gray-700">Orange Money</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Total Calculé -->
        <div class="bg-amber-50 rounded-xl p-4 text-center border border-amber-200">
          <p class="text-sm text-amber-800 font-semibold">TOTAL À ENREGISTRER</p>
          <p class="text-4xl font-extrabold text-amber-700 mt-1"><span id="totalDisplay">0</span> FCFA</p>
        </div>

        <button type="submit" class="w-full py-4 rounded-xl gradient-primary text-white font-extrabold text-lg shadow-lg hover:shadow-xl hover:scale-[1.02] transition transform">
          ✅ Valider la saisie
        </button>
      </form>
    </div>

    <!-- ========== HISTORIQUE DU JOUR ========== -->
    <div class="bg-white rounded-2xl shadow-sm p-5 md:p-6 fade-in">
      <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        📋 Historique du jour 
        <span class="text-xs font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded-full" id="historyCount">0</span>
      </h3>
      <div id="historyList" class="space-y-3">
        <!-- Rempli par JS -->
      </div>
      <div id="emptyHistory" class="text-center py-6 text-gray-400 text-sm">
        Aucune saisie aujourd'hui.
      </div>
    </div>

  </div>

  <!-- ========== JAVASCRIPT ========== -->
  <script>
    // ===== VÉRIFICATION =====
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'gerante') window.location.href = '/';

    let currentType = 'expense'; // 'expense' ou 'sale'

    // ===== INIT =====
    document.getElementById('geranteName').textContent = user.name;
    document.getElementById('geranteNameSmall').textContent = user.name;
    document.getElementById('geranteInitial').textContent = user.name[0];
    document.getElementById('shopName').textContent = user.shop?.name || 'Mon établissement';
    document.getElementById('dateInput').valueAsDate = new Date();
    
    loadCategories();
    updateStats();
    renderHistory();

    // ===== GESTION DES ONGLETS =====
    function switchTab(type) {
      currentType = type;
      
      // Styles boutons
      const btnExp = document.getElementById('tab-expense');
      const btnSale = document.getElementById('tab-sale');
      const title = document.getElementById('formTitle');
      const paySection = document.getElementById('paymentSection');

      if (type === 'expense') {
        btnExp.classList.add('active-expense');
        btnSale.classList.remove('active-sale');
        title.textContent = "Nouvelle Dépense (Achat)";
        paySection.classList.add('hidden');
      } else {
        btnExp.classList.remove('active-expense');
        btnSale.classList.add('active-sale');
        title.textContent = "Nouvelle Vente (Recette)";
        paySection.classList.remove('hidden');
      }
      
      calcTotal(); // Recalculer au cas où
    }

    // ===== CALCUL AUTOMATIQUE =====
    function setPrice(val) {
      document.getElementById('priceInput').value = val;
      calcTotal();
    }

    function calcTotal() {
      const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      const total = qty * price;
      document.getElementById('totalDisplay').textContent = total.toLocaleString('fr-FR');
    }

    // ===== CATÉGORIES INTELLIGENTES =====
    function saveCategory(val) {
      if (!val) return;
      let cats = JSON.parse(localStorage.getItem('categories') || '[]');
      if (!cats.includes(val)) {
        cats.push(val);
        localStorage.setItem('categories', JSON.stringify(cats));
        loadCategories();
      }
    }

    function loadCategories() {
      const cats = JSON.parse(localStorage.getItem('categories') || '[]');
      const datalist = document.getElementById('categoryList');
      datalist.innerHTML = '';
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        datalist.appendChild(opt);
      });
    }

    // ===== SOUMISSION FORMULAIRE =====
    document.getElementById('entryForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const category = document.getElementById('categoryInput').value;
      const desc = document.getElementById('descInput').value;
      const date = document.getElementById('dateInput').value;
      const qty = parseFloat(document.getElementById('qtyInput').value);
      const unitPrice = parseFloat(document.getElementById('priceInput').value);
      const total = qty * unitPrice;
      
      let payment = 'cash'; // Par défaut pour dépenses
      if (currentType === 'sale') {
        payment = document.querySelector('input[name="payment"]:checked').value;
      }

      const transaction = {
        id: Date.now().toString(),
        type: currentType,
        category,
        desc,
        date,
        qty,
        unitPrice,
        total,
        payment,
        geranteId: user.id,
        geranteName: user.name,
        shopId: user.shop?.id || 'default',
        timestamp: new Date().toISOString()
      };

      // Sauvegarde globale
      const allData = JSON.parse(localStorage.getItem('transactions') || '[]');
      allData.push(transaction);
      localStorage.setItem('transactions', JSON.stringify(allData));

      showToast(currentType === 'sale' ? '✅ Vente enregistrée !' : '✅ Dépense enregistrée !');
      
      // Reset partiel
      document.getElementById('descInput').value = '';
      document.getElementById('qtyInput').value = '1';
      document.getElementById('priceInput').value = '';
      document.getElementById('totalDisplay').textContent = '0';
      
      updateStats();
      renderHistory();
    });

    // ===== HISTORIQUE & STATS =====
    function renderHistory() {
      const allData = JSON.parse(localStorage.getItem('transactions') || '[]');
      const today = new Date().toISOString().split('T')[0];
      
      // Filtrer : Aujourd'hui + Ma boutique (ou toutes si pas de shopId strict)
      const myItems = allData.filter(i => i.date === today && i.geranteId === user.id)
                             .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      const container = document.getElementById('historyList');
      const emptyMsg = document.getElementById('emptyHistory');
      document.getElementById('historyCount').textContent = myItems.length;

      container.innerHTML = '';
      if (myItems.length === 0) {
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
        myItems.forEach(item => {
          const isSale = item.type === 'sale';
          container.innerHTML += `
            <div class="flex items-center justify-between p-3 rounded-xl ${isSale ? 'bg-emerald-50' : 'bg-red-50'} border border-transparent hover:border-gray-200 transition">
              <div class="flex items-center gap-3">
                <div class="text-xl">${isSale ? '💰' : '📉'}</div>
                <div>
                  <p class="font-bold text-gray-800 text-sm">${item.category} <span class="text-gray-500 font-normal">(${item.desc})</span></p>
                  <p class="text-xs text-gray-500">Qté: ${item.qty} • ${item.payment === 'om' ? '📱 OM' : '💵 Cash'}</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-extrabold ${isSale ? 'text-emerald-600' : 'text-red-600'}">${item.total.toLocaleString()} F</span>
                <button onclick="deleteItem('${item.id}')" class="text-gray-400 hover:text-red-500 transition">✕</button>
              </div>
            </div>
          `;
        });
      }
    }

    function deleteItem(id) {
      if(!confirm("Supprimer cette saisie ?")) return;
      let allData = JSON.parse(localStorage.getItem('transactions') || '[]');
      allData = allData.filter(i => i.id !== id);
      localStorage.setItem('transactions', JSON.stringify(allData));
      updateStats();
      renderHistory();
    }

    function updateStats() {
      const allData = JSON.parse(localStorage.getItem('transactions') || '[]');
      const today = new Date().toISOString().split('T')[0];
      
      let sales = 0, expenses = 0;
      allData.forEach(i => {
        if (i.date === today && i.geranteId === user.id) {
          if (i.type === 'sale') sales += i.total;
          else expenses += i.total;
        }
      });

      document.getElementById('todaySales').textContent = sales.toLocaleString('fr-FR');
      document.getElementById('todayExpenses').textContent = expenses.toLocaleString('fr-FR');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = '/';
    }
  </script>
</body>
</html>
